name: Verify reports and evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify evidence and documentation
        run: python tools/verify_repository.py
      - name: Test the verifier
        run: python -m unittest discover -s tests -v

      - name: Install and verify in a fresh local environment
        run: python tools/install.py
      - name: Exercise the Windows double-click wrapper from another directory
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:SETUP_PYTHON = (Get-Command python).Source
          $env:SETUP_NO_PAUSE = '1'
          $entry = Join-Path $PWD 'Install.cmd'
          Push-Location $env:RUNNER_TEMP
          & $entry
          $result = $LASTEXITCODE
          Pop-Location
          if ($result -ne 0) { throw "Install.cmd failed: $result" }
